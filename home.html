<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>እድል Home</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: auto;
      min-height: 100vh;
      padding: 18px 16px 30px;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: linear-gradient(135deg, #ffb300, #ff6f00);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 900;
      box-shadow: 0 0 25px rgba(255, 179, 0, 0.25);
    }

    .brand-text h1 {
      font-size: 22px;
      font-weight: 900;
    }

    .brand-text p {
      color: #888894;
      font-size: 12px;
      margin-top: 3px;
    }

    .profile-btn {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      border: 1px solid #292934;
      background: #15151e;
      color: white;
      font-size: 19px;
    }

    /* BALANCE */
    .balance-card {
      background: linear-gradient(135deg, #171720, #111119);
      border: 1px solid #292933;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 25px;
    }

    .balance-label {
      color: #8e8e9a;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .balance {
      font-size: 29px;
      font-weight: 900;
    }

    .currency {
      color: #ffb300;
      font-size: 15px;
      margin-left: 3px;
    }

    /* SECTION TITLE */
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .section-title h2 {
      font-size: 18px;
      font-weight: 800;
    }

    .section-title span {
      color: #777783;
      font-size: 11px;
    }

    /* GAME CARDS */
    .games {
      display: grid;
      gap: 14px;
    }

    .game-card {
      position: relative;
      overflow: hidden;
      min-height: 155px;
      border-radius: 24px;
      padding: 20px;
      border: 1px solid #30303b;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .game-card:active {
      transform: scale(0.97);
    }

    .bingo {
      background:
        radial-gradient(circle at 90% 10%, rgba(255, 179, 0, 0.25), transparent 35%),
        linear-gradient(135deg, #201a0d, #15130f);
    }

    .numbers {
      background:
        radial-gradient(circle at 90% 10%, rgba(80, 150, 255, 0.25), transparent 35%),
        linear-gradient(135deg, #101a2a, #11141c);
    }

    .game-icon {
      font-size: 34px;
      margin-bottom: 9px;
    }

    .game-card h3 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .game-card p {
      color: #aaaab5;
      font-size: 12px;
      margin-bottom: 15px;
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      background: #fff;
      color: #111;
    }

    .bingo .play-btn {
      background: #ffb300;
    }

    .numbers .play-btn {
      background: #4d9cff;
      color: white;
    }

    /* ANNOUNCEMENT */
    .announcement {
      margin-top: 25px;
      margin-bottom: 25px;
      padding: 15px 17px;
      border-radius: 17px;
      background: #15151e;
      border: 1px solid #292934;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .announcement-icon {
      font-size: 22px;
    }

    .announcement-text {
      overflow: hidden;
      white-space: nowrap;
    }

    .announcement-text strong {
      display: block;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .announcement-text p {
      color: #92929d;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* QUICK ACTIONS */
    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .quick-btn {
      min-height: 65px;
      border-radius: 17px;
      border: 1px solid #292934;
      background: #15151e;
      color: white;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
    }

    .quick-icon {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: #20202b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">

      <div class="brand">

        <div class="logo">እ</div>

        <div class="brand-text">
          <h1>እድል</h1>
          <p>Welcome back, Player</p>
        </div>

      </div>

      <button class="profile-btn">👤</button>

    </header>


    <!-- BALANCE -->
    <section class="balance-card">

      <div class="balance-label">
        YOUR BALANCE
      </div>

      <div class="balance" id="homeBalance">
  0.00 <span class="currency">Br</span>
</div>

    </section>


    <!-- GAMES -->
    <div class="section-title">

      <h2>Choose Your Game</h2>

      <span>PLAY & WIN</span>

    </div>


    <section class="games">

      <!-- BINGO -->
      <div class="game-card bingo">

        <div class="game-icon">🎱</div>

        <h3>እድል Bingo</h3>

        <p>
          Play Bingo and compete for real prizes.
        </p>

        <a href="index.html" class="play-btn">
  PLAY BINGO →
</a>

      </div>


      <!-- NUMBERS -->
      <div class="game-card numbers">

        <div class="game-icon">🔢</div>

        <h3>እድል Numbers</h3>

        <p>
          Pick your numbers and try your luck.
        </p>

        <div class="play-btn">
          PLAY NUMBERS →
        </div>

      </div>

    </section>


    <!-- ANNOUNCEMENT -->
    <section class="announcement">

      <div class="announcement-icon">
        📢
      </div>

      <div class="announcement-text">

        <strong>ANNOUNCEMENT</strong>

        <p>
          🔥 New games and rewards are available!
        </p>

      </div>

    </section>


    <!-- QUICK ACTIONS -->
    <div class="section-title">

      <h2>Quick Actions</h2>

    </div>


    <section class="quick-actions">

      <button class="quick-btn">

        <div class="quick-icon">
          💰
        </div>

        Deposit

      </button>


      <button class="quick-btn">

        <div class="quick-icon">
          💸
        </div>

        Withdraw

      </button>


      <button class="quick-btn">

        <div class="quick-icon">
          📖
        </div>

        How to Play

      </button>


      <button class="quick-btn">

        <div class="quick-icon">
          🎧
        </div>

        Support

      </button>

    </section>

  </div>

</body>
 <script>
  const tg = window.Telegram?.WebApp;

  tg?.ready();
  tg?.expand();

  const API = 'https://za-bingo-5a7e.onrender.com';

  async function loadHomeBalance() {
  const telegramUser = tg?.initDataUnsafe?.user;

  if (!telegramUser) {
    console.log('Telegram user not found');
    return;
  }

  const playerId = String(telegramUser.id);

  try {
    const response = await fetch(`${API}/api/player/${playerId}`);
    const data = await response.json();

    if (data.player) {
      document.getElementById('homeBalance').innerHTML =
        `${Number(data.player.balance ?? 0).toFixed(2)} <span class="currency">Br</span>`;
    }
  } catch (error) {
    console.error('Could not load balance:', error);
  }
}

  loadHomeBalance();
</script>
</html>
