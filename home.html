<!DOCTYPE html>
<html lang="en">
<head>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>እድል Home</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: auto;
      min-height: 100vh;
      padding: 18px 16px 30px;
    }

    .header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  font-family: var(--font-display);
  font-size: 1.4rem;
  color: #f5c842;
  letter-spacing: 2px;
  text-shadow: 0 0 20px rgba(245,200,66,.4);
}

.logo span {
  color: #ffffff;
  font-size: .75rem;
  display: block;
  letter-spacing: 4px;
  font-weight: 400;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.live-bingo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: linear-gradient(135deg, #1f2937, #111827);
  border: 1px solid var(--gold-dim);
  border-radius: 20px;
  padding: 6px 14px;
  font-family: var(--font-display);
  font-size: .60rem;
  font-weight: 900;
  letter-spacing: .8px;
  line-height: 1;
  color: var(--gold);
}

.live-dot {
  width: 7px;
  height: 7px;
  min-width: 7px;
  border-radius: 50%;
  background: #ff0000;
  box-shadow: 0 0 5px rgba(255, 0, 0, .7);
  animation: livePulse 1.2s ease-in-out infinite;
}

    /* BALANCE */
    .balance-card {
      background: linear-gradient(135deg, #171720, #111119);
      border: 1px solid #292933;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 10px;
    }

    .balance-label {
      color: #8e8e9a;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .balance {
      font-size: 29px;
      font-weight: 900;
    }

    .currency {
      color: #ffb300;
      font-size: 15px;
      margin-left: 3px;
    }
    .balance-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.bonus-box {
  text-align: right;
}

.bonus-balance {
  font-size: 20px;
  font-weight: 900;
  color: #ffb300;
}

    /* SECTION TITLE */
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 13px;
  margin-top: 10px;
}

.section-title h2 {
  font-size: 18px;
  font-weight: 800;
}

.section-title span {
  color: #f5c842;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.8px;
  text-shadow: 0 0 10px rgba(245, 200, 66, 0.35);
}

    /* GAME CARDS */
    .games {
      display: grid;
      gap: 14px;
    }

  .game-card {
  position: relative;
  overflow: hidden;
  min-height: 155px;
  border-radius: 24px;
  padding: 20px;
  border: 1px solid #30303b;
  cursor: pointer;
  transition: transform 0.15s ease;
  width: 100%;
  text-align: left;
  color: inherit;
  font-family: inherit;
  
}

    .game-card:active {
      transform: scale(0.97);
    }

    .bingo {
  background:
    radial-gradient(circle at 90% 10%, rgba(255,255,255,.65), transparent 35%),
    linear-gradient(135deg, #dcc7ee 0%, #c9b0e8 50%, #b795dc 100%);
}

    .numbers {
      background:
        radial-gradient(circle at 90% 10%, rgba(80, 150, 255, 0.25), transparent 35%),
        linear-gradient(135deg, #101a2a, #11141c);
    }

    .game-icon {
      font-size: 34px;
      margin-bottom: 9px;
    }

    .game-card h3 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .game-card p {
      color: #aaaab5;
      font-size: 12px;
      margin-bottom: 15px;
    }
    .bingo h3 {
  color: #000000;
}

.bingo p {
  color: #000000;
}

    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      background: #fff;
      color: #111;
    }

    .bingo .play-btn {
      background: #ffb300;
    }

    .numbers .play-btn {
      background: #4d9cff;
      color: #000;
    }

    /* ANNOUNCEMENT */
    .announcement {
      margin-top: 25px;
      margin-bottom: 25px;
      padding: 15px 17px;
      border-radius: 17px;
      background: #15151e;
      border: 1px solid #292934;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .announcement-icon {
      font-size: 22px;
    }

    .announcement-text {
      overflow: hidden;
      white-space: nowrap;
    }

    .announcement-text strong {
      display: block;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .announcement-text p {
      color: #92929d;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* PLAYER ACTION BUTTONS */
.quick-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.quick-btn {
  min-height: 72px;
  border-radius: 19px;
  border: 1px solid #2d2d38;
  background: linear-gradient(145deg, #1b1b25, #111119);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  text-align: left;
  cursor: pointer;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 5px 15px rgba(0,0,0,.18);
}

.quick-btn:active {
  transform: scale(0.97);
}

.quick-btn .quick-icon {
  width: 40px;
  height: 40px;
  min-width: 40px;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
}

.quick-btn strong {
  display: block;
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 4px;
}

.quick-btn span {
  display: block;
  color: #858591;
  font-size: 10px;
  font-weight: 500;
}

/* DEPOSIT */
.deposit-btn {
  border-color: rgba(245, 200, 66, .30);
}

.deposit-btn .quick-icon {
  background: rgba(245, 200, 66, .12);
  box-shadow: 0 0 12px rgba(245, 200, 66, .08);
}

.deposit-btn strong {
  color: #22c55e;
}

/* WITHDRAW */
.withdraw-btn {
  border-color: rgba(255, 95, 95, .25);
}

.withdraw-btn .quick-icon {
  background: rgba(255, 95, 95, .10);
}

.withdraw-btn strong {
  color: #ff8b8b;
}
  </style>
  <script>
const firebaseConfig = {
  apiKey: "AIzaSyCMfDNAWQtrJGijQLUC5KQWi5hVTgEvJTo",
  authDomain: "zabingo-d2ed5.firebaseapp.com",
  databaseURL: "https://zabingo-d2ed5-default-rtdb.firebaseio.com/",
  projectId: "zabingo-d2ed5",
  storageBucket: "zabingo-d2ed5.firebasestorage.app",
  messagingSenderId: "75991744418",
  appId: "1:75991744418:web:70afa1b06418ddc50ffcfb"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>
</head>

<body>

  <div class="app">

    <!-- HEADER -->
<header class="header">

  <div class="brand">

    <div class="logo">
      እድል
      <span>Games</span>
    </div>

    <div class="brand-text">
      <p>🅆🄴🄻🄲🄾🄼🄴</p>
    </div>

  </div>

  <div class="header-right">

    <div class="live-bingo">
      <span class="live-dot"></span>
      <span>LIVE</span>
    </div>

    <button class="profile-btn">👤</button>

  </div>

</header>


    <!-- BALANCE -->
<section class="balance-card">

  <div class="balance-row">

    <div>
      <div class="balance-label">
        YOUR BALANCE
      </div>

      <div class="balance" id="homeBalance">
        0.00 <span class="currency">Br</span>
      </div>
    </div>

    <div class="bonus-box">
      <div class="balance-label">
        BONUS BALANCE
      </div>

      <div class="bonus-balance" id="homeBonusBalance">
        0.00 <span class="currency">Br</span>
      </div>
    </div>

  </div>

</section>
    <!-- QUICK ACTIONS -->
    


    <section class="quick-actions">

      <button class="quick-btn deposit-btn">

  <div class="quick-icon">
    💰
  </div>

  <div>
    <strong>Wallet</strong>
    <span>Add money</span>
  </div>

</button>


      <button class="quick-btn withdraw-btn">

  <div class="quick-icon">
    🧙‍♂️
  </div>

  <div>
    <strong>Profile</strong>
    <span>◈</span>
  </div>

</button>
     </section>

    <!-- GAMES -->
    <div class="section-title">

      <h2></h2>

      <span>የጫወቱ ይሸለሙ</span>

    </div>


    <section class="games">

      <!-- BINGO -->
      <button class="game-card bingo" onclick="window.location.href='index.html'">

  <div class="game-icon">🅞</div>

  <h3>እድል Bingo</h3>

  <p>
     ባለ 5,10,15 የጨዋታ ክፍሎች
  </p>

</button>


      <!-- NUMBERS -->
      <div class="game-card numbers">

        <div class="game-icon">🔢</div>

        <h3>እድል Numbers</h3>

        <p>
          Pick your numbers and try your luck.
        </p>

        <div class="play-btn">
          PLAY NUMBERS →
        </div>

      </div>

    </section>


    <!-- ANNOUNCEMENT -->
    <section class="announcement">

      <div class="announcement-icon">
        📢
      </div>

      <div class="announcement-text">

        <strong>ANNOUNCEMENT</strong>

        <p>
          🔥 New games and rewards are available!
        </p>

      </div>

    </section>
    <button class="quick-btn support-btn">
  <div class="quick-icon">
    🎧
  </div>
  Support
</button>


    

  </div>
<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const telegramUser = tg.initDataUnsafe?.user;

if (telegramUser) {
  const playerId = String(telegramUser.id);

  db.ref(`players/${playerId}`).on('value', (snapshot) => {
  const player = snapshot.val() || {};

  const balance = Number(player.balance || 0);
  const bonusBalance = Number(player.referralBonusBalance || 0);

  document.getElementById('homeBalance').innerHTML =
    `${balance.toFixed(2)} <span class="currency">Br</span>`;

  document.getElementById('homeBonusBalance').textContent =
    bonusBalance.toFixed(2);
});
}
</script>
</body>
</html>
